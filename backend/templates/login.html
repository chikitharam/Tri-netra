<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in · Trinetra</title>
    <style>
        :root {
            --bg-0: #05070c;
            --bg-1: #0a0e16;
            --bg-2: #0f141e;
            --border-0: #161d29;
            --border-1: #1e2836;
            --border-2: #2a3648;
            --text-0: #e8edf5;
            --text-1: #b4bfd0;
            --text-2: #7d8a9e;
            --text-3: #515e73;
            --accent: #4ea8de;
            --accent-dim: rgba(78, 168, 222, .12);
            --accent-line: rgba(78, 168, 222, .35);
            --error: #ff4757;
            --mono: 'JetBrains Mono', 'SF Mono', 'Menlo', 'Consolas', monospace;
            --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            background: var(--bg-0);
            color: var(--text-0);
            font-family: var(--sans);
            font-size: 14px;
            line-height: 1.55;
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
        }

        .card {
            background: linear-gradient(180deg, var(--bg-2), var(--bg-1));
            border: 1px solid var(--border-1);
            border-radius: 16px;
            padding: 40px 36px 32px;
            width: 100%;
            max-width: 420px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 30px 80px rgba(0,0,0,.5);
        }

        .card::before {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 2px;
            background: linear-gradient(90deg, var(--accent), #7c5cff);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 26px;
            justify-content: center;
        }

        .brand-mark {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            background: linear-gradient(135deg, var(--accent), #7c5cff);
            display: grid;
            place-items: center;
            font-size: 20px;
        }

        .brand-text { text-align: left; }

        .brand-name {
            font-size: 17px;
            font-weight: 800;
            letter-spacing: -0.3px;
        }

        .brand-sub {
            font-size: 10.5px;
            color: var(--text-3);
            letter-spacing: 1.5px;
            text-transform: uppercase;
            font-family: var(--mono);
        }

        .card h1 {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: -0.3px;
            margin-bottom: 6px;
            text-align: center;
        }

        .card p.sub {
            color: var(--text-2);
            font-size: 13.5px;
            text-align: center;
            margin-bottom: 28px;
        }

        label {
            display: block;
            font-size: 11.5px;
            color: var(--text-2);
            margin-bottom: 7px;
            font-weight: 700;
            letter-spacing: .8px;
            text-transform: uppercase;
            font-family: var(--mono);
        }

        input[type=email],
        input[type=password] {
            width: 100%;
            padding: 12px 14px;
            margin-bottom: 18px;
            background: var(--bg-0);
            border: 1px solid var(--border-1);
            border-radius: 8px;
            color: var(--text-0);
            font-size: 14.5px;
            font-family: inherit;
            transition: border-color .15s, background .15s;
        }

        input:focus {
            outline: none;
            border-color: var(--accent-line);
            background: var(--bg-1);
        }

        button {
            width: 100%;
            padding: 13px;
            background: linear-gradient(180deg, var(--accent), #3a8fc4);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 14.5px;
            font-weight: 700;
            letter-spacing: .3px;
            cursor: pointer;
            transition: opacity .15s, transform .1s;
            font-family: inherit;
            margin-top: 4px;
        }

        button:hover { opacity: .92; }
        button:active { transform: translateY(1px); }

        .error {
            background: rgba(255, 71, 87, .1);
            border: 1px solid rgba(255, 71, 87, .35);
            color: #ff8a93;
            padding: 11px 14px;
            border-radius: 8px;
            font-size: 13.5px;
            margin-bottom: 20px;
            text-align: center;
        }

        .signup-link {
            margin-top: 24px;
            text-align: center;
            font-size: 13px;
            color: var(--text-3);
        }
        
        .signup-link a {
            color: var(--accent);
            font-weight: 700;
            text-decoration: none;
        }
        
        .signup-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="brand">
            <div class="brand-mark">🛡️</div>
            <div class="brand-text">
                <div class="brand-name">TRINETRA</div>
                <div class="brand-sub">threat intelligence</div>
            </div>
        </div>

        <h1>Sign in</h1>
        <p class="sub">Access threats relevant to your community</p>

        {% if error %}
        <div class="error">{{ error }}</div>
        {% endif %}

        <form method="POST" action="/login">
            <label for="email">Email</label>
            <input type="email" id="email" name="email"
                   required autofocus autocomplete="email"
                   placeholder="you@example.com">

            <label for="password">Password</label>
            <input type="password" id="password" name="password"
                   required autocomplete="current-password"
                   placeholder="••••••••">

            <button type="submit">Sign In →</button>
        </form>

        <!-- ADMIN LOGIN LINK -->
        <div class="signup-link" style="margin-top: 20px; margin-bottom: 10px;">
            <a href="/" style="color: var(--text-2); font-size: 13px;">🔐 Admin Console Login</a>
        </div>

        <!-- SIGN UP LINK -->
        <div class="signup-link">
            Don't have an account? <a href="/register">Sign Up</a>
        </div>
    </div>
</body>
</html>
